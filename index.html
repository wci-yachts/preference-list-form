<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preference List</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#1f2933; --ink-soft:#6b7684; --line:#e2e5e9; --paper:#ffffff; --paper-dim:#f7f8f9;
    --accent:#1f2933; --accent-soft:#eef0f2; --danger:#a13f2e; --danger-bg:#fbeceA;
    --radius:6px; --shadow:0 1px 3px rgba(0,0,0,.06);
  }
  html[data-brand="wci"]{
    --accent:#518b41; --accent-soft:#eaf2e7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--paper-dim); color:var(--ink); line-height:1.45;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 0 60px;}
  .brand-header{background:var(--accent);color:#fff;padding:28px 24px;text-align:center;}
  .brand-header img{max-width:280px;width:70%;height:auto;display:block;margin:0 auto 14px;}
  .brand-header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.01em;}
  .brand-header p{margin:8px 0 0;font-size:13px;opacity:.92;max-width:520px;margin-left:auto;margin-right:auto;}
  .plain-header{padding:32px 24px 20px;text-align:center;}
  .plain-header h1{margin:0;font-size:22px;font-weight:700;color:var(--ink);}
  .plain-header p{margin:8px 0 0;font-size:13px;color:var(--ink-soft);max-width:520px;margin-left:auto;margin-right:auto;}
  .card{background:var(--paper);margin:16px;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden;}
  .card-head{background:var(--accent-soft);padding:13px 18px;border-bottom:1px solid var(--line);}
  .card-head .num{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);}
  .card-head h2{margin:2px 0 0;font-size:15.5px;font-weight:700;color:var(--ink);}
  .card-head .hint{margin:4px 0 0;font-size:12px;color:var(--ink-soft);font-weight:400;}
  .card-body{padding:18px;}
  .field{margin-bottom:14px;}
  .field:last-child{margin-bottom:0;}
  .field-label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;}
  input[type=text],input[type=email],input[type=tel],input[type=date],input[type=time],input[type=number],select,textarea{
    width:100%;font-family:inherit;font-size:14px;color:var(--ink);background:#fff;
    border:1px solid var(--line);border-radius:5px;padding:9px 11px;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;}
  textarea{resize:vertical;min-height:64px;}
  .row{display:grid;gap:12px;}
  .row.c2{grid-template-columns:1fr 1fr;}
  .row.c3{grid-template-columns:1fr 1fr 1fr;}
  .row.c4{grid-template-columns:1fr 1fr 1fr 1fr;}
  @media(max-width:600px){.row.c2,.row.c3,.row.c4{grid-template-columns:1fr;}}
  .choice-group{display:flex;flex-wrap:wrap;gap:8px;}
  .choice{
    display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:20px;
    padding:7px 14px;font-size:13px;cursor:pointer;background:#fff;user-select:none;transition:.12s;
  }
  .choice:hover{border-color:var(--accent);}
  .choice input{margin:0;accent-color:var(--accent);}
  .choice.checked{background:var(--accent-soft);border-color:var(--accent);font-weight:600;}
  .subhead{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin:20px 0 10px;padding-top:16px;border-top:1px dashed var(--line);}
  .subhead:first-child{margin-top:0;padding-top:0;border-top:none;}
  table.grid{width:100%;border-collapse:collapse;font-size:13px;}
  table.grid th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);padding:8px 6px;border-bottom:1.5px solid var(--line);}
  table.grid td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle;}
  table.grid input[type=text],table.grid input[type=date],table.grid input[type=number]{padding:7px 8px;font-size:13px;}
  .like-dislike{display:flex;gap:14px;align-items:center;}
  .like-dislike label{display:flex;align-items:center;gap:5px;font-size:12.5px;cursor:pointer;}
  .row-remove{background:none;border:none;color:var(--danger);font-size:17px;cursor:pointer;padding:2px 6px;line-height:1;}
  .add-row-btn{background:none;border:1px dashed var(--line);color:var(--accent);border-radius:5px;padding:8px 14px;font-size:12.5px;font-weight:600;cursor:pointer;margin-top:8px;}
  .add-row-btn:hover{background:var(--accent-soft);}
  .table-scroll{overflow-x:auto;}
  .submit-bar{margin:24px 16px 0;text-align:center;}
  .btn-submit{
    background:var(--accent);color:#fff;border:none;border-radius:6px;padding:15px 40px;
    font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.15);
  }
  .btn-submit:disabled{opacity:.5;cursor:default;}
  .footer-note{max-width:520px;margin:24px auto 0;padding:0 24px;text-align:center;font-size:11px;color:var(--ink-soft);}
  .success-screen{max-width:480px;margin:80px auto;padding:40px 30px;text-align:center;}
  .success-screen .mark{width:58px;height:58px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 18px;}
  .success-screen h2{margin:0 0 8px;font-size:20px;}
  .success-screen p{color:var(--ink-soft);font-size:14px;}
  .error-banner{background:var(--danger-bg);color:var(--danger);border-radius:5px;padding:12px 16px;font-size:13px;font-weight:600;margin:16px;text-align:center;}
  .file-input-wrap{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}
</style>
</head>

const qs = new URLSearchParams(location.search);
const isWci = qs.get('wci') === '1';
document.documentElement.setAttribute('data-brand', isWci ? 'wci' : 'plain');

function esc(s){
  return (s===undefined||s===null?'':String(s)).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function uid(){ return Math.random().toString(36).slice(2)+Date.now().toString(36); }

const STATE = {
  clientName: qs.get('client') || '',
  yachtName: qs.get('yacht') || '',
  charterStartDate: qs.get('start') || '',
  charterEndDate: qs.get('end') || '',
  contactPhone: '', contactEmail: '',
  arrivalDate:'', arrivalAirport:'', arrivalFlight:'', arrivalTime:'', arrivalTransport:'',
  departureDate:'', departureAirport:'', departureFlight:'', departureTime:'', departureTransport:'',
  hotelBeforeName:'', hotelBeforeIn:'', hotelBeforeOut:'',
  hotelAfterName:'', hotelAfterIn:'', hotelAfterOut:'',
  passengers: [ {id:uid(), name:'', nationality:'', dob:'', passportNo:'', passportExpiry:''} ],
  pace: '', interests: {}, sightseeingWishlist:'',
  mealTimes:{breakfast:'', lunch:'', dinner:''},
  breakfastStyle:{type:'', weight:'', notes:''},
  lunchStyle:{type:[], weight:'', service:''},
  afternoonTea:'',
  dinnerStyle:{formal:'', aperitifs:'', startersDesserts:'', cheeseBiscuits:'', service:'', courses:''},
  dineAshore:'', cookingStyle:[], beefDoneness:'', soup:'', mayoCream:'',
  foodGrid: [
    'Beef','Pork','Lamb','Veal','Poultry / Chicken','Turkey','Duck','Game','Liver',
    'Fish','Shellfish / Seafood','Dairy Products','Pasta','Salads','Vegetables','Fruit',
    'Cheese','Desserts / Cakes','Snacks & Cocktail Food'
  ].map(item=>({id:uid(), item, like:false, dislike:false, notes:''})),
  specialDiets: {}, specialDietsOther:'', vegetarianEats:{eggs:false,cheese:false,fish:false},
  cuisineStyle:'', favoriteDishes:'', ingredientsAvoid:'',
  wines: [ {id:uid(), country:'', name:'', qty:''} ],
  champagne:{nonVintage:'', vintage:'', qty:''},
  maxPrice: [ {id:uid(), type:'', price:''} ],
  spirits: [ {id:uid(), type:'', brand:'', qty:''} ],
  softDrinks:'', cocktails:'', teaCoffee:'',
  medicalConditions:'', doctorContact:'',
  allergies:'',
  occasions: [ {id:uid(), type:'', date:'', who:'', notes:''} ],
  flowersPreference:'', flowersFrequency:'',
  readingMaterial:'',
  cabins: [ {id:uid(), deck:'', cabin:'', type:'', guest:''} ],
  additionalNotes:'',
  website:'' // honeypot
};

const INTEREST_OPTIONS = ['Archaeology & culture','Local arts & crafts','Sightseeing','Meeting local people',
  'Swimming & snorkeling','Diving','Water skiing','Windsurfing / watersports','Fishing','Shopping','Dancing & night-life'];
const DIET_OPTIONS = ['Dairy-free','Wheat / gluten-free','Low cholesterol','Vegetarian','Vegan','Low sodium','Low fat','Diabetic / sugar-free','Halal','Kosher'];

let submitted = false;
let submitting = false;
let errorMsg = '';

function render(){
  const app = document.getElementById('app');
  if(submitted){
    app.innerHTML = renderSuccess();
    return;
  }
  app.innerHTML = `
    ${renderHeader()}
    <div class="wrap">
      ${errorMsg ? `<div class="error-banner">${esc(errorMsg)}</div>` : ''}
      ${renderCharterInfo()}
      ${renderContact()}
      ${renderTravel()}
      ${renderCharterParty()}
      ${renderPaceInterests()}
      ${renderDining()}
      ${renderFoodGrid()}
      ${renderSpecialDiets()}
      ${renderCuisine()}
      ${renderWineBar()}
      ${renderMedical()}
      ${renderOccasions()}
      ${renderFlowers()}
      ${renderReading()}
      ${renderCabins()}
      ${renderNotes()}
      <div class="submit-bar">
        <button class="btn-submit" id="btn-submit" ${submitting?'disabled':''}>${submitting?'Sending…':'Submit Preference List'}</button>
      </div>
      <div class="footer-note">
        ${isWci
          ? 'West Coast International UK Ltd. — Sterling House, Fulbourne Road, E17 4EE London UK — office@westcoastint.com — www.westcoastint.com<br>Strictly confidential — the information you provide here is used solely to prepare your charter.'
          : 'The information you provide here is used solely to prepare your charter and is kept confidential.'}
      </div>
    </div>
  `;
  wireEvents();
}

function renderHeader(){
  if(isWci){
    return `
    <div class="brand-header">
      <img src="data:image/jpeg;base64,${WCI_LOGO_B64}" alt="West Coast International">
      <h1>Preference List</h1>
      <p>Help us prepare a charter tailored exactly to you — the more detail, the better we can look after you and your guests on board.</p>
    </div>`;
  }
  return `
    <div class="plain-header">
      <h1>Preference List</h1>
      <p>Help us prepare a charter tailored exactly to you — the more detail, the better we can look after you and your guests on board.</p>
    </div>`;
}

function renderSuccess(){
  return `
  <div class="success-screen">
    <div class="mark">✓</div>
    <h2>Thank you!</h2>
    <p>Your preference list has been received. We'll make sure everything is ready for you on board.</p>
  </div>`;
}

function sectionHead(num, title, hint){
  return `<div class="card-head"><div class="num">Section ${num}</div><h2>${esc(title)}</h2>${hint?`<div class="hint">${esc(hint)}</div>`:''}</div>`;
}

function renderCharterInfo(){
  return `
  <div class="card">
    ${sectionHead('—','Your Charter')}
    <div class="card-body">
      <div class="row c2">
        <div class="field"><label class="field-label">Client / Charterer Name</label><input type="text" data-f="clientName" value="${esc(STATE.clientName)}"></div>
        <div class="field"><label class="field-label">Yacht Name</label><input type="text" data-f="yachtName" value="${esc(STATE.yachtName)}"></div>
      </div>
      <div class="row c2">
        <div class="field"><label class="field-label">Charter Start Date</label><input type="date" data-f="charterStartDate" value="${esc(STATE.charterStartDate)}"></div>
        <div class="field"><label class="field-label">Charter End Date</label><input type="date" data-f="charterEndDate" value="${esc(STATE.charterEndDate)}"></div>
      </div>
    </div>
  </div>`;
}

function renderContact(){
  return `
  <div class="card">
    ${sectionHead(1,'Charterer Contact','A number/email we can reach you on 48 hours before the charter begins')}
    <div class="card-body">

      </table>
      </div>
      <button type="button" class="add-row-btn" data-add-row="cabins">+ Add</button>
    </div>
  </div>`;
}

function renderNotes(){
  return `
  <div class="card">
    ${sectionHead(15,'Anything Else?')}
    <div class="card-body">
      <div class="field"><label class="field-label">Any other information that would help make your charter a success</label><textarea data-f="additionalNotes" rows="5">${esc(STATE.additionalNotes)}</textarea></div>
      <input type="text" class="file-input-wrap" tabindex="-1" autocomplete="off" data-f="website" value="${esc(STATE.website)}">
    </div>
  </div>`;
}

function wireEvents(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-f]').forEach(el=>{
    el.addEventListener(el.tagName==='TEXTAREA' || el.type==='text' || el.type==='email' || el.type==='tel' ? 'input' : 'change', ()=>{
      const key = el.dataset.f;
      if(key==='bf-notes'){ STATE.breakfastStyle.notes = el.value; return; }
      STATE[key] = el.value;
    });
  });

  app.querySelectorAll('input[name="pace"]').forEach(el=>el.addEventListener('change', ()=>{ STATE.pace = el.value; render(); }));
  app.querySelectorAll('[data-interest]').forEach(el=>el.addEventListener('change', ()=>{ STATE.interests[el.dataset.interest] = el.checked; render(); }));
  app.querySelectorAll('input[name="bf-type"]').forEach(el=>el.addEventListener('change', ()=>{ STATE.breakfastStyle.type = el.value; render(); }));
  app.querySelectorAll('input[name="bf-weight"]').forEach(el=>el.addEventListener('change', ()=>{ STATE.breakfastStyle.weight = el.value; render(); }));
  app.querySelectorAll('[data-lunch-type]').forEach(el=>el.addEventListener('change', ()=>{
    const v = el.dataset.lunchType;
    const idx = STATE.lunchStyle.type.indexOf(v);
    if(el.checked && idx===-1) STATE.lunchStyle.type.push(v);
    if(!el.checked && idx!==-1) STATE.lunchStyle.type.splice(idx,1);
    render();
  }));
  app.querySelectorAll('input[name="lunch-weight"]').forEach(el=>el.addEventListener('change', ()=>{ STATE.lunchStyle.weight = el.value; render(); }));
  app.querySelectorAll('input[name="lunch-service"]').forEach(el=>el.addEventListener('change', ()=>{ STATE.lunchStyle.service = el.value; render(); }));
  app.querySelectorAll('input[name="pm-tea"]').forEach(el=>el.addEventListener('change', ()=>{ STATE.afternoonTea = el.value; render(); }));
  app.querySelectorAll('[data-yn]').forEach(el=>el.addEventListener('change', ()=>{
    const path = el.dataset.yn.split('.');
    if(path.length===2) STATE[path[0]][path[1]] = el.value; else STATE[path[0]] = el.value;
    render();
  }));
  app.querySelectorAll('input[name="dinner-service"]').forEach(el=>el.addEventListener('change', ()=>{ STATE.dinnerStyle.service = el.value; render(); }));
  app.querySelectorAll('input[name="dinner-courses"]').forEach(el=>el.addEventListener('change', ()=>{ STATE.dinnerStyle.courses = el.value; render(); }));
  app.querySelectorAll('input[name="dine-ashore"]').forEach(el=>el.addEventListener('change', ()=>{ STATE.dineAshore = el.value; render(); }));
  app.querySelectorAll('[data-cooking]').forEach(el=>el.addEventListener('change', ()=>{
    const v = el.dataset.cooking; const idx = STATE.cookingStyle.indexOf(v);
    if(el.checked && idx===-1) STATE.cookingStyle.push(v);
    if(!el.checked && idx!==-1) STATE.cookingStyle.splice(idx,1);
    render();
  }));
  app.querySelectorAll('input[name="beef-doneness"]').forEach(el=>el.addEventListener('change', ()=>{ STATE.beefDoneness = el.value; render(); }));
  app.querySelectorAll('input[name="soup"]').forEach(el=>el.addEventListener('change', ()=>{ STATE.soup = el.value; render(); }));

  app.querySelectorAll('[data-food-like]').forEach(el=>el.addEventListener('change', ()=>{
    const row = STATE.foodGrid.find(f=>f.id===el.dataset.foodLike);
    row.like = el.checked; if(el.checked) row.dislike = false; render();
  }));
  app.querySelectorAll('[data-food-dislike]').forEach(el=>el.addEventListener('change', ()=>{
    const row = STATE.foodGrid.find(f=>f.id===el.dataset.foodDislike);
    row.dislike = el.checked; if(el.checked) row.like = false; render();
  }));
  app.querySelectorAll('[data-food-notes]').forEach(el=>el.addEventListener('input', ()=>{
    STATE.foodGrid.find(f=>f.id===el.dataset.foodNotes).notes = el.value;
  }));

  app.querySelectorAll('[data-diet]').forEach(el=>el.addEventListener('change', ()=>{ STATE.specialDiets[el.dataset.diet] = el.checked; render(); }));
  app.querySelectorAll('[data-veg]').forEach(el=>el.addEventListener('change', ()=>{ STATE.vegetarianEats[el.dataset.veg] = el.checked; }));

  app.querySelectorAll('input[name="flowers-freq"]').forEach(el=>el.addEventListener('change', ()=>{ STATE.flowersFrequency = el.value; render(); }));

  // repeatable tables: passengers, wines, maxPrice, spirits, occasions, cabins
  wireRepeatable('passengers','pf');
  wireRepeatable('wines','wf');
  wireRepeatable('maxPrice','mpf');
  wireRepeatable('spirits','spf');
  wireRepeatable('occasions','of');
  wireRepeatable('cabins','cbf');

  app.querySelectorAll('[data-cf]').forEach(el=>el.addEventListener('input', ()=>{ STATE.champagne[el.dataset.cf] = el.value; }));

  app.querySelectorAll('[data-add-row]').forEach(el=>el.addEventListener('click', ()=>{
    const key = el.dataset.addRow;
    const templates = {
      passengers: {id:uid(), name:'', nationality:'', dob:'', passportNo:'', passportExpiry:''},
      wines: {id:uid(), country:'', name:'', qty:''},
      maxPrice: {id:uid(), type:'', price:''},
      spirits: {id:uid(), type:'', brand:'', qty:''},
      occasions: {id:uid(), type:'', date:'', who:'', notes:''},
      cabins: {id:uid(), deck:'', cabin:'', type:'', guest:''}
    };
    STATE[key].push(templates[key]);
    render();
  }));
  app.querySelectorAll('[data-remove-row]').forEach(el=>el.addEventListener('click', ()=>{
    const key = el.dataset.removeRow, id = el.dataset.removeId;
    STATE[key] = STATE[key].filter(r=>r.id!==id);
    render();
  }));

  const submitBtn = document.getElementById('btn-submit');
  if(submitBtn) submitBtn.addEventListener('click', handleSubmit);
}

function wireRepeatable(stateKey, dataAttr){
  document.querySelectorAll(`tr[data-row="${stateKey}"]`).forEach(tr=>{
    const id = tr.dataset.id;
    const row = STATE[stateKey].find(r=>r.id===id);
    tr.querySelectorAll(`[data-${dataAttr}]`).forEach(el=>{
      const field = el.dataset[dataAttr]; // e.g. data-pf="name" -> el.dataset.pf === 'name'
      el.addEventListener('input', ()=>{ row[field] = el.value; });
    });
  });
}

function handleSubmit(){
  if(STATE.website){ return; } // honeypot tripped — silently do nothing
  if(!STATE.clientName || !STATE.yachtName){
    errorMsg = 'Please fill in at least the client name and yacht name at the top.';
    render();
    window.scrollTo(0,0);
    return;
  }
  submitting = true; errorMsg = '';
  render();

  const payload = {
    client_name: STATE.clientName,
    yacht_name: STATE.yachtName,
    charter_start_date: STATE.charterStartDate || null,
    charter_end_date: STATE.charterEndDate || null,
    contact_phone: STATE.contactPhone,
    contact_email: STATE.contactEmail,
    travel: {
      arrival: {date:STATE.arrivalDate, airport:STATE.arrivalAirport, flight:STATE.arrivalFlight, time:STATE.arrivalTime, notes:STATE.arrivalTransport},
      departure: {date:STATE.departureDate, airport:STATE.departureAirport, flight:STATE.departureFlight, time:STATE.departureTime, notes:STATE.departureTransport},
      hotelBefore: {name:STATE.hotelBeforeName, in:STATE.hotelBeforeIn, out:STATE.hotelBeforeOut},
      hotelAfter: {name:STATE.hotelAfterName, in:STATE.hotelAfterIn, out:STATE.hotelAfterOut}
    },
    charter_party: STATE.passengers.map(({id,...rest})=>rest),
    pace: STATE.pace,
    interests: Object.keys(STATE.interests).filter(k=>STATE.interests[k]),
    sightseeing_wishlist: STATE.sightseeingWishlist,
    dining: {
      mealTimes: STATE.mealTimes,
      breakfast: STATE.breakfastStyle,
      lunch: STATE.lunchStyle,
      afternoonTea: STATE.afternoonTea,
      dinner: STATE.dinnerStyle,
      dineAshore: STATE.dineAshore,
      cookingStyle: STATE.cookingStyle,
      beefDoneness: STATE.beefDoneness,
      soup: STATE.soup,
      mayoCream: STATE.mayoCream
    },
    food_grid: STATE.foodGrid.map(({id,...rest})=>rest),
    special_diets: Object.keys(STATE.specialDiets).filter(k=>STATE.specialDiets[k]),
    special_diets_other: STATE.specialDietsOther,
    vegetarian_eats: STATE.vegetarianEats,
    cuisine_style: STATE.cuisineStyle,
    favorite_dishes: STATE.favoriteDishes,
    ingredients_avoid: STATE.ingredientsAvoid,
    wines: STATE.wines.map(({id,...rest})=>rest),
    champagne: STATE.champagne,
    max_price_per_bottle: STATE.maxPrice.map(({id,...rest})=>rest),
    spirits: STATE.spirits.map(({id,...rest})=>rest),
    soft_drinks: STATE.softDrinks,
    cocktails: STATE.cocktails,
    tea_coffee: STATE.teaCoffee,
    medical_conditions: STATE.medicalConditions,
    doctor_contact: STATE.doctorContact,
    allergies: STATE.allergies,
    occasions: STATE.occasions.map(({id,...rest})=>rest),
    flowers_preference: STATE.flowersPreference,
    flowers_frequency: STATE.flowersFrequency,
    reading_material: STATE.readingMaterial,
    cabins: STATE.cabins.map(({id,...rest})=>rest),
    additional_notes: STATE.additionalNotes,
    website: ''
  };

  supabaseClient.from('preference_lists').insert(payload).then(({error})=>{
    submitting = false;
    if(error){
      console.error('Submit failed', error);
      errorMsg = 'Something went wrong sending your preference list. Please try again, or contact us directly.';
      render();
      window.scrollTo(0,0);
      return;
    }
    submitted = true;
    render();
    window.scrollTo(0,0);
  });
}

render();
</script>
</body>
</html>
